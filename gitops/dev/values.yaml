# Desired state: nexops-dev
#
# The `tag:` line below is rewritten by the Jenkins pipeline on every successful
# build of main. Do not edit it by hand — your change will be overwritten on the
# next build.
image:
  tag: "1.0.0"

backend:
  replicaCount: 1
frontend:
  replicaCount: 1

ingress:
  host: nexops-dev.local

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3

config:
  nodeEnv: development
  logLevel: debug
  corsOrigin: "http://nexops-dev.local"
  seedEnabled: true
  prometheusUrl: "http://prometheus-server.monitoring.svc.cluster.local"
  lokiUrl: "http://loki.logging.svc.cluster.local:3100"

postgres:
  storage: 2Gi
