# SonarQube project configuration, read by sonar-scanner-cli.

sonar.projectKey=nexops
sonar.projectName=NexOps DevOps Platform
sonar.projectVersion=1.0.0

# Analyse application source only. Config, manifests and generated output add
# noise and skew the duplication and coverage numbers.
sonar.sources=backend/src,frontend/src
sonar.tests=backend/tests

sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/*.test.js,**/*.spec.js
sonar.test.inclusions=backend/tests/**/*.test.js
sonar.coverage.exclusions=backend/src/db/seed.js,backend/src/server.js,frontend/src/main.jsx

sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info

sonar.sourceEncoding=UTF-8
