# =====================================================================
# NexOps Helm values
#
# Install:
#   helm upgrade --install nexops ./helm/nexops \
#     --namespace nexops-dev --create-namespace \
#     --set image.tag=1.0.3
#
# Per-environment files live alongside this one:
#   helm/nexops/values-dev.yaml
#   helm/nexops/values-staging.yaml
#   helm/nexops/values-prod.yaml
# =====================================================================

nameOverride: ""
fullnameOverride: ""

# ---------------------------------------------------------------- images
image:
  registry: docker.io
  repository: ravinadh777          # your Docker Hub account
  backend: nexops-backend
  frontend: nexops-frontend
  # One tag for both images: they are built from the same commit by the same
  # pipeline, so keeping them in lockstep makes a rollback unambiguous.
  tag: "1.0.0"
  pullPolicy: IfNotPresent
  pullSecrets: []                  # e.g. [{ name: dockerhub-creds }] for a private repo

# ------------------------------------------------------------- workloads
backend:
  replicaCount: 2
  port: 4000
  resources:
    requests: { cpu: 100m, memory: 192Mi }
    limits:   { cpu: 600m, memory: 512Mi }
  # Runs before the API starts. seed.js loads demo data; switch to migrate.js
  # in production so no demo rows are created.
  initCommand: ["node", "src/db/seed.js"]

frontend:
  replicaCount: 2
  port: 8080
  resources:
    requests: { cpu: 25m,  memory: 48Mi }
    limits:   { cpu: 200m, memory: 128Mi }

# ------------------------------------------------------------------ data
postgres:
  enabled: true                    # false to point at a managed database
  image: postgres:16-alpine
  storage: 2Gi
  storageClass: ""                 # empty uses the cluster default (local-path on kind)
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 500m, memory: 512Mi }

redis:
  enabled: true
  image: redis:7-alpine
  maxmemory: 128mb
  resources:
    requests: { cpu: 50m,  memory: 64Mi }
    limits:   { cpu: 200m, memory: 160Mi }

# --------------------------------------------------------------- routing
ingress:
  enabled: true
  className: nginx
  host: nexops.local
  # Also answer on the bare IP, so the app is reachable on an EC2 box without
  # editing /etc/hosts first.
  includeIPRule: true
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "2m"
  tls:
    enabled: false
    secretName: nexops-tls

# ------------------------------------------------------------------- HPA
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# --------------------------------------------------------------- config
config:
  nodeEnv: production
  logLevel: info
  jwtExpiresIn: 8h
  cacheTtlSeconds: 30
  corsOrigin: "http://nexops.local"
  # Set these once the observability stacks are installed and the Monitoring
  # and Logs pages switch from stored samples to live PromQL and LogQL.
  prometheusUrl: ""
  lokiUrl: ""
  seedEnabled: true

# --------------------------------------------------------------- secrets
#
# createSecret: false is the right answer for any real environment. Create the
# Secret out of band and set existingSecret to its name:
#
#   kubectl -n nexops-prod create secret generic nexops-prod-secrets \
#     --from-literal=POSTGRES_PASSWORD="$(openssl rand -base64 24)" \
#     --from-literal=JWT_SECRET="$(openssl rand -hex 32)" \
#     --from-literal=DATABASE_URL="postgresql://nexops:PASS@nexops-postgres:5432/nexops"
#
secrets:
  createSecret: true               # true only for a throwaway training cluster
  existingSecret: ""
  postgresDb: nexops
  postgresUser: nexops
  postgresPassword: "CHANGE_ME_training_only"
  jwtSecret: "CHANGE_ME_openssl_rand_hex_32"
  seedAdminUsername: admin
  seedAdminPassword: "admin123"

serviceAccount:
  create: true
  name: ""
  annotations: {}

# Scrape annotations for the Prometheus config in monitoring/.
metrics:
  enabled: true
  path: /api/metrics

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

nodeSelector: {}
tolerations: []
affinity: {}
