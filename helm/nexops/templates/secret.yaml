{{- if and .Values.secrets.createSecret (not .Values.secrets.existingSecret) }}
# Created only when secrets.createSecret is true, which should be the case for
# a throwaway training cluster and nothing else. In production set
# secrets.existingSecret and create it out of band, or seal it with SOPS.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nexops.fullname" . }}-secrets
  labels:
    {{- include "nexops.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_DB: {{ .Values.secrets.postgresDb | quote }}
  POSTGRES_USER: {{ .Values.secrets.postgresUser | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
  JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
  SEED_ADMIN_USERNAME: {{ .Values.secrets.seedAdminUsername | quote }}
  SEED_ADMIN_PASSWORD: {{ .Values.secrets.seedAdminPassword | quote }}
  DATABASE_URL: {{ printf "postgresql://%s:%s@%s:5432/%s" .Values.secrets.postgresUser .Values.secrets.postgresPassword (include "nexops.postgresHost" .) .Values.secrets.postgresDb | quote }}
{{- end }}
