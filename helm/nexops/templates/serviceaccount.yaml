{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "nexops.serviceAccountName" . }}
  labels:
    {{- include "nexops.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# NexOps never calls the Kubernetes API, so it gets no token.
automountServiceAccountToken: false
{{- end }}
