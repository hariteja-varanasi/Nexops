# PostgreSQL as a StatefulSet, not a Deployment.
#
# Why: a StatefulSet gives each replica a stable name (postgres-0) and its own
# PersistentVolumeClaim that survives pod restarts and rescheduling. A
# Deployment with a shared PVC would corrupt the data directory the moment two
# pods ran at once during a rolling update.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    app: postgres
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: nexops
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
        app.kubernetes.io/part-of: nexops
    spec:
      securityContext:
        fsGroup: 999          # postgres gid in the official image; makes the PVC writable
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom: { secretKeyRef: { name: nexops-secrets, key: POSTGRES_DB } }
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: nexops-secrets, key: POSTGRES_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: nexops-secrets, key: POSTGRES_PASSWORD } }
            # The image refuses to initialise into a non-empty mount root, and
            # every PVC arrives with a lost+found. A subdirectory avoids that.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          # Readiness gates traffic; liveness restarts a wedged process. Both use
          # pg_isready rather than a TCP check, which would pass while the
          # database is still replaying WAL and not yet accepting queries.
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB -h 127.0.0.1"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB -h 127.0.0.1"]
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: 500m, memory: 512Mi }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        # kind ships the local-path provisioner as the default StorageClass,
        # which writes to the node's filesystem. Good enough for training,
        # not for anything that must survive the node.
        resources:
          requests:
            storage: 2Gi
