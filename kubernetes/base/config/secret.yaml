# ---------------------------------------------------------------------
# TEMPLATE ONLY - values here are placeholders for a training cluster.
#
# stringData is plain text in this file, which is exactly why this file is
# never the real source of credentials. Create the real Secret imperatively:
#
#   kubectl -n nexops-dev create secret generic nexops-secrets \
#     --from-literal=POSTGRES_PASSWORD="$(openssl rand -base64 24)" \
#     --from-literal=JWT_SECRET="$(openssl rand -hex 32)" \
#     --from-literal=SEED_ADMIN_PASSWORD="$(openssl rand -base64 16)"
#
# For GitOps, encrypt with Sealed Secrets or SOPS before committing.
# See docs/kubernetes.md for both paths.
# ---------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: nexops-secrets
  labels:
    app.kubernetes.io/part-of: nexops
type: Opaque
stringData:
  POSTGRES_DB: "nexops"
  POSTGRES_USER: "nexops"
  POSTGRES_PASSWORD: "CHANGE_ME_training_only"
  # Assembled here rather than in the Deployment so the password appears in
  # exactly one place. postgres-0.postgres is the StatefulSet's stable DNS name.
  DATABASE_URL: "postgresql://nexops:CHANGE_ME_training_only@postgres:5432/nexops"
  JWT_SECRET: "CHANGE_ME_openssl_rand_hex_32"
  SEED_ADMIN_USERNAME: "admin"
  SEED_ADMIN_PASSWORD: "admin123"
