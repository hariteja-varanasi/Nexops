# Horizontal Pod Autoscaler.
#
# Requires metrics-server in the cluster; scripts/create-kind-cluster.sh
# installs it with --kubelet-insecure-tls, which kind needs because its
# kubelet serving certificates are self-signed.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend
  labels:
    app: backend
    app.kubernetes.io/part-of: nexops
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
    - type: Resource
      resource:
        name: memory
        target: { type: Utilization, averageUtilization: 80 }
  behavior:
    scaleDown:
      # Wait 5 minutes of sustained low load before removing pods, so a brief
      # dip does not cause a scale-down/scale-up flap.
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
