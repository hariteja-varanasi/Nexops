# Default-deny ingress for the namespace, then explicit allows.
#
# The effect students can verify: `kubectl exec` into any other pod and curl
# postgres:5432 — it hangs. Only the backend is permitted to reach it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  labels:
    app.kubernetes.io/part-of: nexops
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-controller
  labels:
    app.kubernetes.io/part-of: nexops
spec:
  podSelector:
    matchExpressions:
      - { key: app, operator: In, values: [frontend, backend] }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        # Also allow pod-to-pod inside the namespace (frontend -> backend).
        - podSelector: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-backend-to-data
  labels:
    app.kubernetes.io/part-of: nexops
spec:
  podSelector:
    matchExpressions:
      - { key: app, operator: In, values: [postgres, redis] }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app: backend }
---
# Prometheus lives in another namespace and must still reach /api/metrics.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-scrape
  labels:
    app.kubernetes.io/part-of: nexops
spec:
  podSelector:
    matchLabels: { app: backend }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - { protocol: TCP, port: 4000 }
