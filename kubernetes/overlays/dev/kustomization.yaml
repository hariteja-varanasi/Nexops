apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: nexops-dev

resources:
  - ../../base

images:
  - name: nexops-backend
    newName: docker.io/haritejarv/nexops-backend
    newTag: latest
  - name: nexops-frontend
    newName: docker.io/haritejarv/nexops-frontend
    newTag: latest

# Dev is the smallest environment: one replica each, demo data seeded.
replicas:
  - { name: backend,  count: 1 }
  - { name: frontend, count: 1 }

patches:
  - target: { kind: Ingress, name: nexops }
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: nexops-dev.local
  - target: { kind: HorizontalPodAutoscaler, name: backend }
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 3

configMapGenerator:
  - name: nexops-config
    behavior: merge
    literals:
      - NODE_ENV=development
      - LOG_LEVEL=debug
      - SEED_ENABLED=true
